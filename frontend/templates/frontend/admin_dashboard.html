{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>داشبورد ادمین</title>
  <link rel="stylesheet" href="{% static 'frontend/css/style.css' %}">
</head>
<body>
  <header class="dashboard-header">
    <div class="logo-title">
      <h1 id="admin-name">نام ادمین</h1>
      <p>خوش آمدید</p>
    </div>
    <button id="logout-btn" class="btn-logout">خروج از حساب</button>
  </header>

  <main class="dashboard-content">
    <div class="card" onclick="location.href=`/dashboard/admin/profile/`">
      <h3>ویرایش حساب کاربری</h3>
    </div>
    <div class="card" onclick="location.href=`/dashboard/admin/institutes/`">
      <h3>موسسه‌های من</h3>
    </div>
  </main>

  <script>
    const token = localStorage.getItem("token");
    const userId = localStorage.getItem("user_id");
    const adminNameEl = document.getElementById("admin-name");

    if (token && userId) {
      fetch(`http://localhost:8000/api/core/users/${userId}/`, {
        method: "GET",
        headers: {
          "Authorization": `Token ${token}`
        }
      })
      .then(response => {
        if (!response.ok) throw new Error("دریافت اطلاعات ادمین با خطا مواجه شد.");
        return response.json();
      })
      .then(data => {
        if (data.first_name || data.last_name) {
          const fullName = `${data.first_name || ""} ${data.last_name || ""}`.trim();
          adminNameEl.textContent = fullName || "ادمین بدون نام";
          localStorage.setItem("admin_name", fullName);
        } else {
          adminNameEl.textContent = "ادمین بدون نام";
        }
      })
      .catch(error => {
        console.error("خطا در دریافت اطلاعات ادمین:", error);
        adminNameEl.textContent = "خطا در بارگذاری نام ادمین";
      });
    } else {
      adminNameEl.textContent = "اطلاعات ناقص است";
    }

    // دکمه خروج
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.clear();
      window.location.href = '/login/';
    });
  </script>
</body>
</html>
